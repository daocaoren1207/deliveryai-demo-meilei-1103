<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 同步设置初始语言到 html lang 属性
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
        } catch (e) {
          // localStorage 不可用时保持默认中文
        }

        try {
          var preference = localStorage.getItem('theme-preference');
          if (preference !== 'light' && preference !== 'dark' && preference !== 'system') {
            preference = 'system';
          }
          var resolved = preference === 'dark' ? 'dark' : 'light';
          if (preference === 'system' && window.matchMedia) {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.style.colorScheme = resolved;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute('content', resolved === 'dark' ? '#15110f' : '#fbf5ea');
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
